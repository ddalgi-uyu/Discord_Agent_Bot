app_name: etf-signal
discord:
  mode: webhook
  webhook_url: ""
  default_color: 5763719
symbols:
- SPY
- QQQ
- VTI
- TSLA
- NVDA
- ARKK
indicators:
  rsi_period: 14
  sma_periods:
  - 20
  - 50
  - 200
  bollinger_period: 20
  bollinger_std: 2.0
sentiment:
  enabled: true
  model: ProsusAI/finbert
  news_per_symbol: 5
thresholds:
  rsi_oversold: 30
  rsi_moderate: 35
  min_confidence: 0.6
schedule:
  cron: 0 9-16 * * mon-fri
  timezone: UTC
logging:
  level: INFO
  json: false
