name: Daily Intelligence Hub

on:
  schedule:
    # This runs at 00:00 UTC every day.
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to trigger it manually for testing

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install dependencies from the requirements file
          if (Test-Path "agent-services/requirements.txt") {
            pip install -r agent-services/requirements.txt
          } else {
            # Fallback to common required libraries if requirements.txt is missing
            pip install httpx pydantic pandas pandas-ta yfinance tenacity
          }

      - name: Run Intelligence Hub
        env:
          # Mapping GitHub Secrets to the Environment Variables your code expects
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NEWS_DIGEST_AI__PROVIDER: ${{ secrets.NEWS_DIGEST_AI__PROVIDER }}
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/agent-services
          python agent-services/scripts/run_all.py --once
