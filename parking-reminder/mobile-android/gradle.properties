# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -Djavax.net.ssl.trustStore=C:/dev-tools/cacerts_jks.jks -Djavax.net.ssl.trustStorePassword=changeit -Dhttp.proxyHost=localhost -Dhttp.proxyPort=3128 -Dhttps.proxyHost=localhost -Dhttps.proxyPort=3128 -Djdk.http.auth.tunneling.host=localhost -Djdk.http.auth.tunneling.port=3128 -Dhttp.nonProxyHosts=localhost|127.*|10.*|192.168.*|*.local
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Proxy — points Gradle at the local PEGAAi OA proxy so dependency resolution
# works inside the corporate network. Override (or remove) on a home machine.
systemProp.http.proxyHost=localhost
systemProp.http.proxyPort=3128
systemProp.https.proxyHost=localhost
systemProp.https.proxyPort=3128
systemProp.http.nonProxyHosts=localhost|127.*|10.*|192.168.*|*.local
systemProp.jdk.http.auth.tunneling.host=localhost
systemProp.jdk.http.auth.tunneling.port=3128

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
